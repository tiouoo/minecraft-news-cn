name: Fetch and Translate Minecraft Patch Notes

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 串行执行：翻译耗时较长，避免定时任务与翻译任务并发修改仓库
concurrency:
  group: fetch-and-translate
  cancel-in-progress: false

jobs:
  # Job 1: 抓取最新补丁说明，并立刻把英文原文提交推送到仓库，
  # 这样翻译尚未完成时，用户也能先看到最新的英文内容。
  fetch-news:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.push.outputs.commit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest patch notes
        run: node scripts/fetch-news.js

      - name: Commit and push English content first
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/
          git diff --cached --quiet || git commit -m "chore: add new English patch notes (auto)"
          git push
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload new items metadata
        uses: actions/upload-artifact@v4
        with:
          name: new-items
          path: |
            new-items.json
            new-items-summary.md
          if-no-files-found: warn
          retention-days: 1

  # Job 2: 英文原文已提交后，再启动耗时的 AI 翻译。
  # 每次运行都会全量检查 source/ 中还没有译文的内容（不含本次新增），
  # 所以上次翻译失败/遗留的条目也会被自动重新翻译。
  translate:
    needs: fetch-news
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 检出 fetch-news 提交后的确切 commit，避免分支引用传播延迟导致拿到旧快照
          ref: ${{ needs.fetch-news.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download new items metadata
        uses: actions/download-artifact@v4
        with:
          name: new-items

      - name: Translate new patch notes
        id: translate
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/translate.js

      - name: Check for content changes
        id: git-diff
        run: |
          if git diff --quiet -- source/ translate/; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push translated changes
        if: steps.git-diff.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/ translate/
          git diff --cached --quiet || git commit -m "chore: update Minecraft patch notes translations (auto)"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create translation status issues
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const pendingLabel = '待翻译';
            const successLabel = 'AI 翻译完成';
            const failureLabel = 'AI 翻译失败';
            const itemsPath = path.join(process.cwd(), 'new-items.json');
            const resultsPath = path.join(process.cwd(), 'translation-results.json');
            const items = fs.existsSync(itemsPath) ? JSON.parse(fs.readFileSync(itemsPath, 'utf8')) : [];
            const results = fs.existsSync(resultsPath)
              ? JSON.parse(fs.readFileSync(resultsPath, 'utf8'))
              : items.map(item => ({ ...item, status: 'failed', error: '翻译脚本未生成结果，请检查工作流日志。' }));

            for (const [name, color, description] of [
              [pendingLabel, 'f29513', '等待人工翻译的内容'],
              [successLabel, '0e8a16', '已由 AI 翻译，等待人工审核'],
              [failureLabel, 'b60205', 'AI 自动翻译失败，需要处理'],
            ]) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              }
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issueTitles = new Set(openIssues.map(issue => issue.title));

            for (const result of results) {
              const prefix = result.status === 'success' ? '[AI 翻译完成]' : '[AI 翻译失败]';
              const title = `${prefix}[${result.edition}] ${result.title}`;
              const oldTitle = `[待翻译][${result.edition}] ${result.title}`;

              if (result.status === 'success') {
                for (const issue of openIssues.filter(issue => issue.title === oldTitle)) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    state: 'closed',
                    state_reason: 'completed',
                  });
                  console.log(`Closed superseded issue #${issue.number}`);
                }
              }

              if (issueTitles.has(title)) {
                console.log(`Skip existing issue: ${title}`);
                continue;
              }

              const body = result.status === 'success'
                ? [
                    '该补丁说明已由 DeepSeek 自动翻译，请贡献者审核术语、上下文和 HTML 结构后再确认质量。',
                    '',
                    `- 版本分支: ${result.edition}`,
                    `- 源文件: \`${result.file}\``,
                    `- 已翻译 HTML: \`${result.targetFile}\``,
                    `- 已更新索引: \`translate/${result.edition === 'Java' ? 'javaPatchNotes.json' : 'bedrockPatchNotes.json'}\``,
                  ].join('\n')
                : [
                    'DeepSeek 自动翻译在多次重试后仍然失败，请检查工作流日志并人工处理。',
                    '',
                    `- 版本分支: ${result.edition}`,
                    `- 源文件: \`${result.file}\``,
                    `- 错误: ${result.error || '未知错误'}`,
                  ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [result.status === 'success' ? successLabel : failureLabel],
              });
              console.log(`Created issue: ${title}`);
            }