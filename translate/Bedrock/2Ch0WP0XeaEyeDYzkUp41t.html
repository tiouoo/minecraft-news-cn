<p>Minecraft 推出全新更新，修复了自1.19.60版本发布后出现的若干问题。</p>
<h1>漏洞修复：</h1>
<ul>
<li>修复任天堂Switch设备游玩时持续卡顿的问题（<a href="https://bugs.mojang.com/browse/MCPE-166760" target="_blank" rel="noopener noreferrer">MCPE-166760</a>）</li>
<li>修复iOS设备游玩时可能发生的游戏崩溃问题</li>
<li>修复存档文件夹名称包含空格时，无法打开对应世界的编辑界面的漏洞（<a href="https://bugs.mojang.com/browse/MCPE-166763" target="_blank" rel="noopener noreferrer">MCPE-166763</a>）</li>
<li>优化手柄操控模式下，市场“我的内容”页面的浏览操作体验</li>
</ul>
