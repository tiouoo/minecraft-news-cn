<p>《我的世界》现已推出全新更新，修复「洞穴与山崖 第二部分」上线后出现的若干问题。</p>
<h1>漏洞修复：</h1>
<ul>
<li>修复PlayStation平台部分大型存档出现贴图损坏、部分数据丢失的故障（漏洞编号：MCPE-149193）</li>
<li>与部分容器交互时可正常打开物品栏界面（漏洞编号：MCPE-148531）</li>
<li>修复附近生物数量较多时，破坏方块、开启箱子、进入传送门操作延迟甚至失效的问题（漏洞编号：MCPE-149214）</li>
<li>修复升级至1.18版本后，部分存档的基岩未正常替换为深层板岩的问题（漏洞编号：MCPE-149251）</li>
</ul>
