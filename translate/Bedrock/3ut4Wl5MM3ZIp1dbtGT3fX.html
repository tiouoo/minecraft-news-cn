<p>《我的世界》推出全新更新，修复1.19.10版本发布后出现的若干问题。</p>
<h1>漏洞修复：</h1>
<ul>
<li>修复生物存档Y坐标大于等于25时，无法正常加载进世界的漏洞</li>
<li>修复Windows平台开启RTX光影后玩家纹理渲染异常的问题（<a href="https://bugs.mojang.com/browse/MCPE-156577" target="_blank" rel="noopener noreferrer">MCPE-156577</a>）</li>
<li>修复Windows平台开启RTX光影后马匹等部分生物纹理渲染错乱的问题（<a href="https://bugs.mojang.com/browse/MCPE-132747" target="_blank" rel="noopener noreferrer">MCPE-132747</a>）</li>
<li>修复领域服游玩时，未填写命令方块别名就无法保存命令方块的问题</li>
<li>修复Xbox平台账号受限封禁后，无法游玩本地存档、无法操作菜单的漏洞</li>
</ul>
