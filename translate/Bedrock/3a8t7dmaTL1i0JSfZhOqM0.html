<p>《我的世界》推出全新更新，修复了1.18.10版本发布后出现的若干重点问题。</p>
<h1>漏洞修复：</h1>
<ul>
<li>优化玩家移动的流畅度（<a href="https://bugs.mojang.com/browse/MCPE-152176" target="_blank" rel="noopener noreferrer">MCPE-152176</a>）</li>
<li>修复循环动画中时间轴为0.0的动画事件有时无法执行的漏洞</li>
<li>领域服的暂停菜单内“邀请玩家加入游戏”按钮现在始终处于可点击状态</li>
<li>修复市场内评分数量与优惠卡片无法正常显示的问题</li>
<li>修复在熔炉界面拖动快捷栏物品时会获得经验的漏洞（<a href="https://bugs.mojang.com/browse/MCPE-152227" target="_blank" rel="noopener noreferrer">MCPE-152227</a>）</li>
</ul>
