<p>现已推出全新更新，用于修复1.19.40版本发布后出现的若干问题。</p>
<h1>漏洞修复：</h1>
<ul>
<li>修复Xbox Series X|S主机恢复游戏进程后，因帧渲染异常造成画面卡顿掉帧的问题（漏洞编号：MCPE-155879）</li>
<li>修复开启RTX光追效果时夜空亮度异常的问题（漏洞编号：MCPE-162445）</li>
<li>使用手柄长按“单个放置”按键，玩家可再次将物品分放至背包各个格子（漏洞编号：MCPE-163625）</li>
<li>修复触屏操控模式下，玩家无法滑动浏览箱子内物品的问题（漏洞编号：MCPE-163619）</li>
<li>修复多项与加入领域服务器相关的故障</li>
</ul>
