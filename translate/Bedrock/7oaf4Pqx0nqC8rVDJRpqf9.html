<p>《我的世界》现已推出更新，修复洞穴与山崖第二部分版本上线后发现的若干问题。</p>
<h1>漏洞修复：</h1>
<ul>
<li>修复在领域服内聊天时可能触发崩溃的问题</li>
<li>下调钻石矿石生成量，与Java版保持一致</li>
<li>修复从其他维度返回主世界后移除光源产生光照异常的漏洞（<a href="https://bugs.mojang.com/browse/MCPE-145828" target="_blank" rel="noopener noreferrer">MCPE-145828</a>）</li>
<li>玩家重生、下床后不会出现移动卡顿的问题</li>
<li>修复多人游戏中其他玩家离开渲染距离后本地模拟停止的问题（<a href="https://bugs.mojang.com/browse/MCPE-147391" target="_blank" rel="noopener noreferrer">MCPE-147391</a>）</li>
<li>传送指令开启方块检测参数时，若目标位置被阻挡将无法完成传送</li>
<li>修复已拥有上限数量领域时，领域购买页面显示异常的问题</li>
<li>优化市场物品栏界面，提升素材图片加载速度</li>
</ul>
