<h1>漏洞修复：</h1>
<ul>
<li>修复多款游戏游玩过程中可能触发的崩溃问题</li>
<li>修复村民服饰无法对应其职业的问题（<a href="https://bugs.mojang.com/browse/MCPE-160475" target="_blank" rel="noopener noreferrer">MCPE-160475</a>）</li>
<li>修复部分设备游玩时出现画面杂色、贴图错乱的漏洞</li>
<li>修复生物头顶命名牌坐标轻微偏移的漏洞（<a href="https://bugs.mojang.com/browse/MCPE-160254" target="_blank" rel="noopener noreferrer">MCPE-160254</a>）</li>
<li>修复市场地图在领域服内部分方块显示为“待更新方块”的问题</li>

</ul>
