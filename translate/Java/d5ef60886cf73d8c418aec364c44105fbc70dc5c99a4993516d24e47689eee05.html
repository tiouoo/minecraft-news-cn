<p>周三发布快照，多么怀旧啊！我们今天发布 26.1 快照 9，以解决昨天快照中引入的两个问题——特别是当任何实体移动到世界垂直边界之外时发生的崩溃。（这完全是个边缘情况，对吧？）<p>此快照还解决了小猫吵闹，以及使用 IME 在游戏中输入文本时预编辑显示不正确的问题。<h1>26.1 快照 9 中修复的漏洞</h1><ul><li><a href=https://bugs.mojang.com/browse/MC-305579 rel="noopener noreferrer"target=_blank>MC-305579</a> 小猫蜷缩在床上时反复喵喵叫<li><a href=https://bugs.mojang.com/browse/MC-306456 rel="noopener noreferrer"target=_blank>MC-306456</a> 当实体超出世界高度限制时游戏崩溃<li><a href=https://bugs.mojang.com/browse/MC-306479 rel="noopener noreferrer"target=_blank>MC-306479</a> 当 below_name 计分板目标激活时，实体阴影会抬高</ul>
