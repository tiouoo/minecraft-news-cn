<p>我们现在为Minecraft: Java版发布1.19.2。此版本修复了一个与安全聊天相关的服务器连接关键问题。</p>
<p>此更新也可以在<a href="https://www.minecraft.net/en-us/article/minecraft-java-edition-1-19-2" target="_blank" rel="noopener noreferrer">minecraft.net</a>上找到。</p>
<p>如果你发现任何Bug，请在官方<a href="https://aka.ms/snapshotbugs?ref=launcher" target="_blank" rel="noopener noreferrer">Minecraft问题追踪器</a>上报告。你也可以在<a href="https://aka.ms/JavaSnapshotFeedback" target="_blank" rel="noopener noreferrer">反馈网站</a>上留下反馈。</p>
<h1>1.19.2中修复的Bug</h1>
<ul>
<li>修复了一个导致玩家在使用安全聊天时被断开连接的问题</li>
<li>修复了社交互动界面中的崩溃问题</li>
</ul>

<p>要安装该版本，请打开<a href="https://www.minecraft.net/download" target="_blank" rel="noopener noreferrer">Minecraft启动器</a>并点击开始！确保你的启动器设置为“最新版本”选项。</p>
