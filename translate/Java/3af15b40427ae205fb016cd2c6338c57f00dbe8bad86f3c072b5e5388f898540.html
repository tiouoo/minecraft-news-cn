<p>随着 Minecraft Live 即将到来，我们距离今年首个更新的发布越来越近了。今天，我们推出了第一个 1.21.5 发布候选版本，其中包含一些漏洞修复；这意味着如果没有新的严重问题出现，这个版本就是我们计划以 Minecraft: Java 版 1.21.5 发布的版本。<h1>1.21.5 发布候选 1 中修复的漏洞</h1><ul><li><a href=https://bugs.mojang.com/browse/MC-295383 rel="noopener noreferrer"target=_blank>MC-295383</a> 字符串“收到来自服务器的遗漏或乱序聊天消息”在逻辑上不合理<li><a href=https://bugs.mojang.com/browse/MC-295412 rel="noopener noreferrer"target=_blank>MC-295412</a> 岩浆块的光照不正确<li><a href=https://bugs.mojang.com/browse/MC-295416 rel="noopener noreferrer"target=_blank>MC-295416</a> 信标接收到来自附近方块的错误明暗</ul>
