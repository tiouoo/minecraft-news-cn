<p>我们现在已经发布了 1.16.4 Release Candidate 1。如果没有发现进一步的关键问题，我们预计此版本将在周四成为 1.16.4 的正式版。</p>
<h1>1.16.4 Release Candidate 1 中的更改</h1>
<ul>
<li>添加了隐藏匹配名称的选项</li>
</ul>
<h2>隐藏匹配名称</h2>
<ul>
<li>某些服务器会以非标准格式发送聊天消息。启用此选项后，游戏将尝试通过匹配消息中的文本来应用聊天隐藏。</li>
</ul>
<h1>修复了 1.16.4 Release Candidate 1 中的漏洞</h1>
<ul>
<li><a href="https://bugs.mojang.com/browse/MC-202614" target="_blank" rel="noopener noreferrer">MC-202614</a> 社交互动界面中的搜索功能只能找到以您输入的字母开头的名称。</li>
</ul>
