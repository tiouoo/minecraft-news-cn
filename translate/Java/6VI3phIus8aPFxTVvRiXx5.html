<p>我们现在正在为 Minecraft 1.18.2 发布第一个（也希望是唯一的）发布候选版本。此发布候选版本修复了两个可能导致服务器停止运行的世界生成漏洞。如果此版本之后没有重大问题，那么正式版发布（计划于 2 月 28 日）之前将不再进行任何更改。
​
祝挖矿愉快！</p>
<h1>1.18.2 发布候选版本 1 修复的漏洞</h1>
<ul>
<li><a href="https://bugs.mojang.com/browse/MC-244682" target="_blank" rel="noopener noreferrer">MC-244682</a> 某些自定义维度设置可能导致服务器停止运行，但不会崩溃</li>
<li><a href="https://bugs.mojang.com/browse/MC-248764" target="_blank" rel="noopener noreferrer">MC-248764</a> 某些世界生成数据包可能导致内部服务器停止运行（可能与密度函数有关）</li>
</ul>
